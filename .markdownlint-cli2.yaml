config:
  default: true
  MD013: false      # line length — prose and tables
  MD033: false      # inline HTML in PR template
  MD041: false      # first line heading
  MD024: false      # duplicate headings across ADR sections
  MD060: false    # first line in file should be a top-level heading
ignores:
  - node_modules
  - "**/.venv/**"
